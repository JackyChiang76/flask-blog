<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Snake Game Demo</title>
<link rel="stylesheet" href="{{ url_for('static', filename='snake/css/style.css') }}">
</head>

<body>
{% include "partials/back_button.html" %}
<h1>Snake Game Demo</h1>
<p>Arrow Keys to Move · Space / P to Pause</p>

<div class="scoreboard">
Score: <span id="score">0</span>
Best (all players): <span id="highscore">{{ highscore }}</span>
</div>

<!--<canvas id="game" width="600" height="600"></canvas>-->
<!-- 修改後 -->
<canvas id="game" width="600" height="600"
        data-submit-url="{{ url_for('snake.submit_score') }}"></canvas>

<div class="controls">
<button id="restart-btn" type="button">Restart</button>
</div>

<script src="{{ url_for('static', filename='snake/js/snake.js') }}"></script>

</body>
</html>
